# Nginx site for futureshield.online → Node Lead Intake (Express on PORT)
# Install:
#   sudo cp deploy/nginx-futureshield.online.conf /etc/nginx/sites-available/futureshield.online
#   sudo ln -sf /etc/nginx/sites-available/futureshield.online /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Ensure PM2/node is listening on 127.0.0.1:3000 (or change proxy_pass).
# Set .env: BASE_URL=https://futureshield.online
# And Admin → Chat Flow → Public base URL = https://futureshield.online

upstream futureshield_node {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name futureshield.online www.futureshield.online;

    # After certbot, this can redirect to HTTPS:
    # return 301 https://$host$request_uri;

    client_max_body_size 25m;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_pass http://futureshield_node;
    }

    location /health {
        proxy_pass http://futureshield_node/health;
        access_log off;
    }
}

